# This workflow is managed by gh actions-lock.

name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7.0.1
      # mise.toml の go と golangci-lint を入れる
      - uses: jdx/mise-action@v5.1.1
      - run: mise run check
